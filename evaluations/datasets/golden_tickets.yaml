- description: Refund requested inside the return window
  vars:
    ticket:
      ticket_id: eval-refund-allow
      subject: Refund an unused item
      message: >-
        Order order-1001 was delivered eight days ago. The item is unused and I would
        like a refund.
      order_id: order-1001
    policies: file://../datasets/support_policies.yaml
    expected:
      intent: refund
      urgency: low
      policy_decision: allow
      requires_escalation: false
  metadata:
    category: refund
    case_type: golden

