name: triage
version: 1.5.0
strategy: many_shot
description: Classify ticket intent, urgency, and sentiment using calibrated intent examples.
variables:
  - ticket_text
model:
  temperature: 0
  max_output_tokens: 300
output_schema: support_prompt_lab.domain.triage.TriageResult
changelog:
  - version: 1.5.0
    change: Cover supported intents with examples aligned to the urgency rubric.
  - version: 1.4.0
    change: Add low-, medium-, and high-urgency boundary examples.
  - version: 1.3.0
    change: Define calibrated urgency boundaries for the zero-shot baseline.
  - version: 1.2.0
    change: Expand examples to cover every supported intent.
  - version: 1.1.0
    change: Add representative few-shot examples.
  - version: 1.0.0
    change: Initial zero-shot baseline.
