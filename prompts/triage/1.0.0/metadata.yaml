name: triage
version: 1.0.0
strategy: zero_shot
description: Classify ticket intent, urgency, and sentiment without examples.
variables:
  - ticket_text
model:
  temperature: 0
  max_output_tokens: 300
output_schema: support_prompt_lab.domain.triage.TriageResult
evaluations:
  - evaluations/datasets/triage_golden.jsonl
changelog:
  - version: 1.0.0
    change: Initial zero-shot baseline.
