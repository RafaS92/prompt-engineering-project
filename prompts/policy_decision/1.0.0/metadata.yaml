name: policy_decision
version: 1.0.0
strategy: zero_shot
description: Apply supplied support policies to a triaged ticket.
variables:
  - ticket_text
  - triage_result
  - support_policies
model:
  temperature: 0
  max_output_tokens: 400
output_schema: support_prompt_lab.domain.policy.PolicyDecision
changelog:
  - version: 1.0.0
    change: Initial zero-shot policy-decision prompt.
